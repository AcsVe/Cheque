name: Build ChequePrinter (exe + installer)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write          # publish to the "latest" release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        timeout-minutes: 10
        env: { QT_QPA_PLATFORM: offscreen, PYTHONFAULTHANDLER: '1' }
        shell: bash
        run: python -m pytest -v -p no:cacheprovider tests 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Test report (one annotation, readable without the log)
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          text = open('pytest.log', encoding='utf-8', errors='replace').read()
          i = text.find('Timeout +++')
          sec = text[i:i + 60000] if i >= 0 else text[-6000:]
          lines = sec.splitlines()
          keep = [l for n, l in enumerate(lines) if 'cheque' in l.lower() or 'test_' in l
                  or (n and ('cheque' in lines[n - 1].lower() or 'test_' in lines[n - 1]))]
          part = '\n'.join(lines[:3] + keep[:80])
          print('::error::' + part.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import cheque_app; print(cheque_app.__version__)')" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm ChequePrinter.spec
      - name: Smoke test of the built program
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\ChequePrinter\ChequePrinter.exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.v.outputs.version }}" installer\ChequePrinter.iss
      - uses: actions/upload-artifact@v4
        with: { name: ChequePrinterSetup, path: dist/ChequePrinterSetup.exe }
      - name: Publish to the fixed download link
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "ChequePrinter — آخر إصدار" --notes "يتحدّث تلقائياً مع كل بناء. حمِّل ChequePrinterSetup.exe وشغّله."
          gh release upload latest dist/ChequePrinterSetup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
